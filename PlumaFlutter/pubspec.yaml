name: pluma
description: "Pluma - Liquid Glass Messenger & Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  http: ^1.2.2

  # ===== Firebase (Android + Web) =====
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.6.2

  # ===== Firebase (Windows — pure Dart) =====
  firedart: ^0.9.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/logo-kogut-1000x1000.png"
    icon_size: 256
  ios: false
  remove_alpha_ios: false
  image_path: "assets/logo-kogut-1000x1000.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo-kogut-64x64.png
    - assets/logo-kogut-100x100.png
    - assets/logo-kogut-200x200.png
    - assets/logo-kogut-250x250.png
    - assets/logo-kogut-500x500.png
    - assets/logo-kogut-1000x1000.png
    - assets/logo-pluma.png
    - assets/bliss-1024p.jpg
    - assets/defaultpfp2.0.jpg

  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Light.ttf
          weight: 300
        - asset: assets/fonts/Ubuntu-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Ubuntu-Regular.ttf
          weight: 400
        - asset: assets/fonts/Ubuntu-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700
        - asset: assets/fonts/Ubuntu-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
