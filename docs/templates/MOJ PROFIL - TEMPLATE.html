<style>
        :root {
            --glass-bg: rgba(6, 23, 0, 0.35);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-accent: #ffb870;
            --iridescent-border: linear-gradient(135deg, rgba(255,184,112,0.2) 0%, rgba(103,218,194,0.1) 50%, rgba(146,207,234,0.1) 100%);
        }
        body {
            background-color: #061700;
            overflow-x: hidden;
            font-family: 'Ubuntu', sans-serif;
        }
        .floating-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card {
            background: rgba(12, 37, 0, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid transparent;
            background-clip: padding-box;
            position: relative;
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: var(--iridescent-border);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .glass-card:hover {
            background: rgba(12, 37, 0, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--neon-accent);
            border-radius: 10px;
        }
        .neon-accent-text {
            color: var(--neon-accent);
        }
        .low-contrast-label {
            color: rgba(187, 242, 149, 0.6);
            letter-spacing: 0.02em;
        }
    </style>
