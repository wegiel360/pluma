<style>
    body {
      background-color: #080A10;
      overflow: hidden;
      margin: 0;
      height: 100vh;
      width: 100vw;
    }

    .bliss-bg {
      position: fixed;
      inset: 0;
      background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAhwkoeveJW1fjHB8ncpSpTvT0GYb7krfNm32bb8RnPTNvYxGHnVuWk9s-oFjRa5mhFEV7kMhD3o8G9JgDFeQiBOPl3SreqGpd4XbZ1p1wSaO84GTe-7Wy9bcSl_gA5w2X4LdSMW7EBnOLghke06iueKrDXaBS7byYZPz27QUWJDsqJoQPuHA_GuzGDwaznuh80Wby0LUHBzaLWSbmRYWMb84enVzAQ8pABSq_CVSpD7xUb-Tp22O53bnz2lveiUf4acw');
      background-size: cover;
      background-position: center;
      filter: brightness(0.6);
      z-index: -1;
    }

    .glass-card {
      background: rgba(24, 30, 44, 0.65);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
    }

    /* Iridescent Border Gradient */
    .iridescent-border {
      position: relative;
    }
    
    .iridescent-border::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, 
        #ff0000, #ff7f00, #ffff00, #00ff00, 
        #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 400% 400%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: iridescent 10s linear infinite;
      pointer-events: none;
    }

    @keyframes iridescent {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .neon-button {
      background: #98FF98;
      color: #003916;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .neon-button:hover {
      box-shadow: 0 0 20px rgba(152, 255, 152, 0.4);
      transform: translateY(-1px);
    }

    .neon-button:active {
      transform: scale(0.98);
    }

    .input-glass {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(152, 255, 152, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-glass:focus {
      border-color: rgba(152, 255, 152, 0.8);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 10px rgba(152, 255, 152, 0.1);
      outline: none;
    }

    .avatar-ring {
      padding: 2px;
      border-radius: 9999px;
      background: transparent;
      transition: all 0.3s ease;
    }

    .avatar-ring:hover {
      background: #98FF98;
      box-shadow: 0 0 10px rgba(152, 255, 152, 0.5);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>

<script>
    // Subtle parallax for the background on mouse move
    document.addEventListener('mousemove', (e) => {
      const bg = document.querySelector('.bliss-bg');
      const moveX = (e.clientX / window.innerWidth - 0.5) * 20;
      const moveY = (e.clientY / window.innerHeight - 0.5) * 20;
      bg.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
    });
  </script>
