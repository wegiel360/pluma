<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        :root {
            /* Liquid Glass v3 Tokens */
            --neon: #98FF98;
            --amber: #CC7A0D;
            --glassBg: rgba(24, 30, 44, 0.65);
            --glassBorder: #2A3040;
            --bg0: #080A10;
            --textMain: #F2F4F8;
            --textMuted: #9A9EA8;
            --radius-std: 20px;
        }
        body {
            background-color: var(--bg0);
            color: var(--textMain);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .liquid-glass-card {
            background: var(--glassBg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glassBorder);
            border-radius: var(--radius-std);
            position: relative;
        }
        /* Iridescent Border Effect */
        .iridescent-border::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(var(--angle, 135deg), 
                #ffb870, #ff70b8, #b870ff, #70b8ff, #70ffb8, #b8ff70, #ffb870);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: rotate-hue 6s linear infinite;
        }
        @keyframes rotate-hue {
            to { filter: hue-rotate(360deg); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--glassBorder);
            border-radius: 10px;
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(152, 255, 152, 0.3);
            border-color: var(--neon) !important;
        }
        .avatar-compact {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--glassBorder);
            transition: all 0.3s ease;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#98FF98",
                        surface: "#181E2C",
                    },
                    borderRadius: {
                        DEFAULT: "20px",
                    }
                }
            }
        }
    </script>
</head>

<script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeEl = document.getElementById('live-time');
            if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;

            const days = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
            const months = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
            
            const dayEl = document.getElementById('live-day');
            const dateEl = document.getElementById('live-date');
            
            if (dayEl) dayEl.textContent = days[now.getDay()];
            if (dateEl) dateEl.textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
