<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pluma - Płynny Żel Messenger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: Arial, Helvetica, sans-serif; }
    body {
      background: url(assets/bliss-1024p.jpg) no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    }
    .container {
      background-color: rgba(0, 0, 0, 0.45);
      padding: 25px 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 440px;
      margin: 15px auto;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      background: url(assets/logo-kogut-250x250.png) no-repeat center;
      background-size: contain;
    }
    .logo-text h1 { font-size: 26px; margin-bottom: 2px; }
    .logo-text p { font-size: 13px; opacity: 0.85; }
    .features {
      text-align: left;
      margin: 15px 0;
      font-size: 14px;
      line-height: 1.7;
    }
    .features li { margin-bottom: 5px; list-style: none; }
    .features li:before { content: "- "; color: #ffb870; }
    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
    }
    .btn {
      display: block;
      padding: 9px 16px;
      background: rgba(255, 184, 112, 0.85);
      color: #222;
      text-decoration: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      min-width: 110px;
      text-align: center;
    }
    .btn:hover { background: rgba(255, 184, 112, 1); }
    .note { font-size: 11px; margin-top: 12px; opacity: 0.75; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-row">
      <div class="logo-img"></div>
      <div class="logo-text">
        <h1>Pluma</h1>
        <p>Płynny Żel Messenger</p>
      </div>
    </div>
    <div class="features">
      <li>Messenger z szyfrowaniem E2E</li>
      <li>Dashboard z pogodą</li>
      <li>Płynny Żel — szklany UI</li>
      <li>Asystent @mietek (AI)</li>
      <li>Android APK + Windows EXE + Linux AppImage</li>
    </div>
    <div class="downloads">
      <a href="https://github.com/wegiel360/pluma/releases/latest" class="btn">Android APK</a>
      <a href="https://github.com/wegiel360/pluma/releases/latest" class="btn">Windows EXE</a>
      <a href="https://github.com/wegiel360/pluma/releases/latest" class="btn">Linux AppImage</a>
    </div>
    <p class="note">Pobierz najnowszy release na GitHub Releases.</p>
  </div>
</body>
</html>
