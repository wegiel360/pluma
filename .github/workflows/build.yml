name: Build APK + AppImage + Windows EXE (NSIS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlumaFlutter
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Configure Firebase
        run: |
          mkdir -p lib
          python3 -c "
          import os
          with open('lib/firebase_options.dart', 'w') as f:
              f.write(os.environ['FIREBASE_OPTIONS_DART'])
          "
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pluma-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-appimage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlumaFlutter
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .
      - name: Configure Firebase
        run: |
          mkdir -p lib
          python3 -c "
          import os
          with open('lib/firebase_options.dart', 'w') as f:
              f.write(os.environ['FIREBASE_OPTIONS_DART'])
          "
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
      - name: Get dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/pluma.desktop << 'EOF'
          [Desktop Entry]
          Name=Pluma
          Comment=Komunikator z wygladem Plynny Zel
          Exec=pluma
          Icon=pluma
          Type=Application
          Categories=Network;Chat;
          EOF
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp ../assets/logo-kogut-1000x1000.png AppDir/usr/share/icons/hicolor/256x256/apps/pluma.png
          cp ../assets/logo-kogut-1000x1000.png AppDir/pluma.png
      - name: Build AppImage
        run: |
          /tmp/appimagetool AppDir Pluma-Linux-x86_64.AppImage
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: pluma-linux
          path: Pluma-Linux-x86_64.AppImage

  build-windows-exe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlumaFlutter
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Configure Firebase
        run: |
          mkdir -p lib
          python3 -c "
          import os
          with open('lib/firebase_options.dart', 'w') as f:
              f.write(os.environ['FIREBASE_OPTIONS_DART'])
          "
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
      - name: Get dependencies
        run: flutter pub get
      - name: Build Windows (EXE)
        run: |
          flutter build windows --release
      - name: Install NSIS + Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis wine
      - name: Create NSIS installer
        shell: bash
        run: |
          INSTALLER_DIR="${RUNNER_TEMP}/installer"
          mkdir -p "${INSTALLER_DIR}"
          cp -r build/windows/runner/Release/* "${INSTALLER_DIR}/"
          cat > /tmp/installer.nsi << 'NSISEOF'
          !define APP_NAME "Pluma"
          !define COMPANY_NAME "PlumaMessenger"
          RequestExecutionLevel admin
          Name "${APP_NAME}"
          OutFile "Pluma-Setup.exe"
          InstallDir "$PROGRAMFILES\\Pluma"
          InstallDirRegKey HKLM "SOFTWARE\\Pluma" "Install_Dir"
          Page directory
          Page instfiles
          Section "MainSection" SEC01
              SetOutDir "$INSTDIR"
              File /r "${INSTALLER_DIR}\\*.*"
              WriteRegStr HKLM "SOFTWARE\\Pluma" "Install_Dir" "$INSTDIR"
              CreateShortCut "$DESKTOP\\Pluma.lnk" "$INSTDIR\\Pluma.exe"
              CreateShortCut "$SMSTARTUP\\Pluma.lnk" "$INSTDIR\\Pluma.exe"
          SectionEnd
          SectionUninstall
              Delete "$INSTDIR\\Pluma.exe"
              Delete "$INSTDIR\\Pluma.lnk"
              Delete "$DESKTOP\\Pluma.lnk"
              Delete "$SMSTARTUP\\Pluma.lnk"
              RMDir "$INSTDIR"
              DeleteRegKey HKLM "SOFTWARE\\Pluma"
          SectionUninstallEnd
          NSISEOF
          wine makensis /tmp/installer.nsi
          cp Pluma-Setup.exe "${RUNNER_TEMP}/Pluma-Setup.exe"
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pluma-windows
          path: ${{ runner.temp }}/Pluma-Setup.exe

  build-and-upload-release:
    runs-on: ubuntu-24.04
    needs: [build-apk, build-appimage, build-windows-exe]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto
          name: Pluma v${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/pluma-android/*
            artifacts/pluma-linux/*
            artifacts/pluma-windows/*

  deploy-landing:
    runs-on: ubuntu-24.04
    needs: [build-and-upload-release]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare landing directory
        run: |
          mkdir -p landing/public/assets
          cp landing/index.html landing/public/index.html
          cp PlumaFlutter/assets/bliss-1024p.jpg landing/public/assets/bliss-1024p.jpg
          cp PlumaFlutter/assets/logo-kogut-250x250.png landing/public/assets/logo-kogut-250x250.png
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: landing/public
          publish_branch: gh-pages
          keep_files: false
          cname: false




