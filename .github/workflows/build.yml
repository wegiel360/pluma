name: Build APK + AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlumaFlutter
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
        
      - name: Configure Firebase
        run: |
          mkdir -p android/app
          echo '${{ secrets.FIREBASE_ANDROID_CONFIG }}' > android/app/google-services.json
          echo '${{ secrets.FIREBASE_OPTIONS_DART }}' > lib/firebase_options.dart
        
      - name: Get dependencies
        run: flutter pub get
       
      - name: Build APK
        run: flutter build apk --release
       
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pluma-android
          path: PlumaFlutter/build/app/outputs/flutter-apk/app-release.apk

  build-appimage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlumaFlutter
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Linux
        run: flutter build linux --release
      
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
      
      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/pluma.desktop << 'EOF'
          [Desktop Entry]
          Name=Pluma
          Comment=Komunikator z wyglądem Płynny Żel
          Exec=pluma
          Icon=pluma
          Type=Application
          Categories=Network;Chat;
          EOF
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp ../assets/logo-kogut-1000x1000.png AppDir/usr/share/icons/hicolor/256x256/apps/pluma.png
          cp ../assets/logo-kogut-1000x1000.png AppDir/pluma.png
      
      - name: Build AppImage
        run: |
          cd /home/runner/work/pluma/pluma/PlumaFlutter
          /tmp/appimagetool AppDir Pluma-Linux-x86_64.AppImage
      
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pluma-linux
          path: PlumaFlutter/Pluma-Linux-x86_64.AppImage

  deploy-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlumaFlutter
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
        
      - name: Configure Firebase
        run: |
          mkdir -p lib
          echo '${{ secrets.FIREBASE_OPTIONS_DART }}' > lib/firebase_options.dart
        
      - name: Get dependencies
        run: flutter pub get
       
      - name: Build Web
        run: flutter build web --release --base-href "/pluma/"
       
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: PlumaFlutter/build/web
          publish_branch: gh-pages
